<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialogi</title>
<style>
/* Always dark: the text sits on film frames. */
:root {
  --bg: #000000; --fg: #eef0f4; --muted: #a0a7b4; --raised: #232730; --border: #333945;
  --fi: #ffffff; --en: #ffd666; --hi: #99e6ff; --accent: #6ea8ff;
  --outline: #000000;
  --dim: rgb(0 0 0 / 0.2);  /* tint over the frame: the picture shows at 80% */
  --sp2: 0.5rem; --sp3: 0.75rem; --sp4: 1rem; --sp5: 1.5rem;
  --radius: 0.75rem;
  --latin: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --deva: "Noto Sans Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--latin); line-height: 1.4;
  -webkit-text-size-adjust: 100%; overflow: hidden; height: 100dvh;
}
.hidden { display: none !important; }

/* floats over the frame; safe-area padding keeps it clear of the notch */
header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp3);
  padding: calc(env(safe-area-inset-top) + var(--sp2)) calc(env(safe-area-inset-right) + var(--sp4)) var(--sp2) calc(env(safe-area-inset-left) + var(--sp4));
  font-size: 0.85rem; color: var(--fg);
}
header select, header button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--fg); background: var(--raised);
  border: 1px solid var(--border); border-radius: var(--radius); min-height: 2.75rem; padding: 0 var(--sp3);
  max-width: 60vw; cursor: pointer;
}
header select:focus-visible, header button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header button { min-width: 3.25rem; padding: 0; font-size: 1.5rem; line-height: 1; }
header button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.picks { display: flex; gap: var(--sp2); min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.counter { font-variant-numeric: tabular-nums; -webkit-text-stroke: 0.2em var(--outline); paint-order: stroke fill; }

.stage { position: fixed; inset: 0; }
/* the frame is the text box's background: 16:9 at most, and taller when a subtitle needs the room */
.frame {
  position: absolute; top: 50%; left: 50%; translate: -50% -50%;
  width: min(100vw, 100dvh * 16 / 9); aspect-ratio: 16 / 9;
  display: grid; align-content: center; gap: var(--sp3); padding: var(--sp4) var(--sp5);
  background: var(--bg) center / cover no-repeat; text-align: center; pointer-events: none;
}
.line { margin: 0; font-size: clamp(1.75rem, 8vmin, 5rem); line-height: 1.25; letter-spacing: 0.05em; overflow-wrap: break-word;
  -webkit-text-stroke: 0.1em var(--outline); paint-order: stroke fill; }  /* stroke is centred: half of it lands outside the letter */
.r1 { color: var(--fi); font-weight: 500; }
.r2 { color: var(--en); }
.r3 { color: var(--hi); }
.line:lang(hi) { font-family: var(--deva); font-size: clamp(1.875rem, 8.6vmin, 5.5rem); letter-spacing: normal; }  /* spacing breaks the Devanagari headline */
/* invisible full-screen tap zones under the frame: left third back, right two-thirds forward */
.tap { position: absolute; top: 0; bottom: 0; background: none; border: 0; padding: 0; cursor: pointer; }
.tap.prev { left: 0; width: 33%; }
.tap.next { right: 0; width: 67%; }
.tap:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.notice { position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: min(30rem, 100vw); padding: var(--sp5); text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="picks">
    <label class="sr-only" for="movie">Movie</label>
    <select class="hidden" id="movie"></select>
    <button class="hidden" id="shuffle" aria-pressed="false" aria-label="Shuffle">🔀</button>
  </div>
  <span class="counter" id="counter" aria-live="polite"></span>
</header>

<main class="stage hidden" id="stage">
  <button class="tap prev" id="tapprev" aria-label="Edellinen / previous"></button>
  <button class="tap next" id="tapnext" aria-label="Seuraava / next"></button>
  <div class="frame" id="frame">
    <p class="line r1" id="r1"></p>
    <p class="line r2" id="r2"></p>
    <p class="line r3" id="r3"></p>
  </div>
</main>

<div class="notice" id="notice" role="status">Loading…</div>
<noscript><div class="notice">This page needs JavaScript to show the slides.</div></noscript>

<script>
"use strict";
// Movies come from movies.json and each deck from <slug>.json, both written by tools/slides.py.
const $ = id => document.getElementById(id);
const rows = ["r1", "r2", "r3"].map($);
const picker = $("movie"), shuffle = $("shuffle");
// order: the slide indices in viewing order; pos: where we are in it
let movies = [], slides = [], order = [], slug = "", pos = 0, request = 0;

const clamp = i => Math.min(slides.length - 1, Math.max(0, i));

async function getJson(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// "#lehdet/42"; a bare "#42" from the old one-movie pages opens the first movie
function fromHash() {
  const [name, n] = decodeURIComponent(location.hash.slice(1)).split("/");
  const known = movies.some(m => m.slug === name);
  return { name: known ? name : movies[0].slug, n: parseInt(known ? n : name, 10) || 1 };
}

function show(state, message = "") {
  $("stage").classList.toggle("hidden", state !== "slides");
  $("notice").classList.toggle("hidden", state === "slides");
  $("notice").textContent = message;
}

// film order, or every slide once in random order starting from `first`
function arrange(first) {
  order = slides.map((_, i) => i);
  if (shuffle.getAttribute("aria-pressed") === "true") {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.splice(order.indexOf(first), 1);
    order.unshift(first);
  }
  pos = order.indexOf(first);
}

function render() {
  const s = slides[order[pos]];
  $("frame").style.backgroundImage = `linear-gradient(var(--dim), var(--dim)), url("${s.img}")`;
  rows.forEach(row => { if (row.lang) row.textContent = s[row.lang] || ""; });
  $("counter").textContent = `${pos + 1} / ${slides.length}`;
  history.replaceState(null, "", `#${slug}/${order[pos] + 1}`);
}

function go(i) {
  if (!slides.length) return;
  i = clamp(i);
  if (i !== pos) { pos = i; render(); }
}

async function open(name, n) {
  const ticket = ++request;  // a slow deck must not replace one picked after it
  const movie = movies.find(m => m.slug === name);
  slug = name; slides = []; picker.value = name;
  document.title = `${movie.title} — dialogi`;
  show("loading", `Loading ${movie.title}…`);
  let deck;
  try {
    deck = await getJson(`${encodeURIComponent(name)}.json`);
  } catch (err) {
    if (ticket === request) show("error", `Couldn't load ${movie.title} (${err.message}). Try again, or pick another movie.`);
    return;
  }
  if (ticket !== request) return;
  const langs = Array.isArray(deck.langs) ? deck.langs : [];
  rows.forEach((row, i) => { row.lang = langs[i] || ""; row.classList.toggle("hidden", !langs[i]); });
  slides = Array.isArray(deck.slides) ? deck.slides : [];
  if (!slides.length) return show("empty", `${movie.title} has no dialogue lines.`);
  show("slides");
  arrange(clamp(n - 1));
  render();
}

async function start() {
  try {
    movies = await getJson("movies.json");
  } catch (err) {
    const hint = location.protocol === "file:"
      ? "This browser blocks pages opened from disk; run python3 tools/serve.py and open the address it prints."
      : "Build a movie with tools/slides.py first.";
    return show("error", `Couldn't load the movie list (${err.message}). ${hint}`);
  }
  if (!Array.isArray(movies) || !movies.length) return show("empty", "No movies built yet. Run tools/slides.py.");
  for (const m of movies) picker.add(new Option(m.title, m.slug));
  picker.classList.remove("hidden");
  shuffle.classList.remove("hidden");
  const h = fromHash();
  open(h.name, h.n);
}

picker.addEventListener("change", () => { picker.blur(); open(picker.value, 1); });
shuffle.addEventListener("click", () => {
  shuffle.setAttribute("aria-pressed", String(shuffle.getAttribute("aria-pressed") !== "true"));
  if (slides.length) { arrange(order[pos]); render(); }
});
$("tapprev").addEventListener("click", () => go(pos - 1));
$("tapnext").addEventListener("click", () => go(pos + 1));
window.addEventListener("hashchange", () => {
  if (!movies.length) return;
  const h = fromHash();
  if (h.name !== slug) open(h.name, h.n); else go(order.indexOf(clamp(h.n - 1)));
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target === picker || (e.target === shuffle && e.key === " ")) return;
  const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
  if (step) { e.preventDefault(); go(pos + step); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(slides.length - 1); }
});

// horizontal swipe; vertical drags are ignored so the page never fights a scroll
let x0 = null, y0 = null;
$("stage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(pos + (dx < 0 ? 1 : -1)); }
});

start();
</script>
</body>
</html>
