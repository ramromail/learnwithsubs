<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dialogi</title>
<style>
/* Always dark: the text sits on film frames. Subtitle palette from tools/subs.py. */
:root {
  --bg: #000000; --fg: #eef0f4; --muted: #a0a7b4; --raised: #232730; --border: #333945;
  --fi: #ffffff; --en: #ffd666; --hi: #99e6ff; --accent: #6ea8ff;
  --band: rgba(0, 0, 0, 0.62);
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --radius: 12px;
  --latin: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
  --deva: "Noto Sans Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", sans-serif;
  --size: clamp(16px, 2.3vw, 30px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--latin); line-height: 1.4;
  -webkit-text-size-adjust: 100%; overflow: hidden;
  display: flex; flex-direction: column; height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.hidden { display: none !important; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp3);
  padding: var(--sp2) var(--sp4); font-size: 0.85rem; color: var(--muted);
}
header select {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--fg); background: var(--raised);
  border: 1px solid var(--border); border-radius: var(--radius); min-height: 44px; padding: 0 var(--sp3);
  max-width: 60vw; cursor: pointer;
}
header select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.counter { font-variant-numeric: tabular-nums; }

/* stage: frame letterboxed to fit, caption overlaid on its bottom edge */
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
figure { position: relative; margin: 0; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: min(100%, calc((100dvh - 110px) * 16 / 9)); container-type: size; }
figure img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
/* middle half of the frame, three equal rows: fi / en / hi; text scales with the frame */
figcaption {
  position: absolute; left: 0; right: 0; top: 25%; height: 50%; background: var(--band);
  padding: 0 var(--sp5); text-align: center;
  display: grid; grid-template-rows: repeat(3, 1fr); align-items: center;
}
.line { margin: 0; font-size: clamp(14px, 4.4cqh, 40px); line-height: 1.25; }
.r1 { color: var(--fi); font-weight: 500; }
.r2 { color: var(--en); }
.r3 { color: var(--hi); }
.line:lang(hi) { font-family: var(--deva); font-size: clamp(15px, 4.8cqh, 44px); }
/* invisible tap zones: left third back, right two-thirds forward */
.tap { position: absolute; top: 0; bottom: 0; background: none; border: 0; padding: 0; cursor: pointer; }
.tap.prev { left: 0; width: 33%; }
.tap.next { right: 0; width: 67%; }
.tap:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

/* portrait phones: frame in the vertical middle, the three rows fill the space under it */
@media (max-aspect-ratio: 4 / 3) {
  .stage { align-items: stretch; }
  figure { width: 100%; aspect-ratio: auto; container-type: normal; display: grid; grid-template-rows: 1fr auto 1fr; }
  figure img { grid-row: 2; height: auto; aspect-ratio: 16 / 9; }
  figcaption { grid-row: 3; position: static; height: auto; background: none; padding: 0 var(--sp4); }
  .line { font-size: clamp(18px, 5.6vw, 28px); }
  .line:lang(hi) { font-size: clamp(19px, 6vw, 30px); }
}

nav { display: flex; align-items: center; justify-content: center; gap: var(--sp3); padding: var(--sp2) var(--sp4) var(--sp3); }
nav button {
  font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--radius); min-width: 44px; min-height: 44px; padding: var(--sp2) var(--sp4); cursor: pointer;
}
nav button:hover { filter: brightness(1.2); }
nav button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
nav button:disabled { opacity: .4; cursor: not-allowed; }
.stamp { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; min-width: 7ch; text-align: center; }
kbd { background: var(--raised); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; font-size: 0.78em; font-family: ui-monospace, monospace; }
.hint { color: var(--muted); font-size: 0.8rem; }
@media (hover: none), (max-width: 600px) { .hint { display: none; } }
.notice { margin: auto; max-width: 480px; padding: var(--sp5); text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <label class="sr-only" for="movie">Movie</label>
  <select class="hidden" id="movie"></select>
  <span class="counter" id="counter" aria-live="polite"></span>
</header>

<main class="stage hidden" id="stage">
  <figure id="figure">
    <img id="frame" alt="">
    <button class="tap prev" id="tapprev" aria-label="Edellinen / previous"></button>
    <button class="tap next" id="tapnext" aria-label="Seuraava / next"></button>
    <figcaption>
      <p class="line r1" id="r1"></p>
      <p class="line r2" id="r2"></p>
      <p class="line r3" id="r3"></p>
    </figcaption>
  </figure>
</main>

<div class="notice" id="notice" role="status">Loading…</div>
<noscript><div class="notice">This page needs JavaScript to show the slides.</div></noscript>

<nav class="hidden" id="nav">
  <button id="prev" aria-label="Previous line">←</button>
  <span class="stamp" id="stamp"></span>
  <button id="next" aria-label="Next line">→</button>
  <span class="hint"><kbd>←</kbd> <kbd>→</kbd> · <kbd>Home</kbd> <kbd>End</kbd></span>
</nav>

<script>
"use strict";
// Movies come from movies.json and each deck from <slug>.json, both written by tools/slides.py.
const $ = id => document.getElementById(id);
const rows = ["r1", "r2", "r3"].map($);
const picker = $("movie");
let movies = [], slides = [], slug = "", at = 0, request = 0;

const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const clamp = i => Math.min(slides.length - 1, Math.max(0, i));

async function getJson(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// "#lehdet/42"; a bare "#42" from the old one-movie pages opens the first movie
function fromHash() {
  const [name, n] = decodeURIComponent(location.hash.slice(1)).split("/");
  const known = movies.some(m => m.slug === name);
  return { name: known ? name : movies[0].slug, n: parseInt(known ? n : name, 10) || 1 };
}

function show(state, message = "") {
  for (const id of ["stage", "nav"]) $(id).classList.toggle("hidden", state !== "slides");
  $("notice").classList.toggle("hidden", state === "slides");
  $("notice").textContent = message;
}

function render() {
  const s = slides[at];
  $("frame").src = s.img;
  rows.forEach(row => { if (row.lang) row.textContent = s[row.lang] || ""; });
  $("counter").textContent = `${at + 1} / ${slides.length}`;
  $("stamp").textContent = clock(s.start);
  $("prev").disabled = at === 0;
  $("next").disabled = at === slides.length - 1;
  history.replaceState(null, "", `#${slug}/${at + 1}`);
}

function go(i) {
  if (!slides.length) return;
  i = clamp(i);
  if (i !== at) { at = i; render(); }
}

async function open(name, n) {
  const ticket = ++request;  // a slow deck must not replace one picked after it
  const movie = movies.find(m => m.slug === name);
  slug = name; slides = []; picker.value = name;
  document.title = `${movie.title} — dialogi`;
  show("loading", `Loading ${movie.title}…`);
  let deck;
  try {
    deck = await getJson(`${encodeURIComponent(name)}.json`);
  } catch (err) {
    if (ticket === request) show("error", `Couldn't load ${movie.title} (${err.message}). Try again, or pick another movie.`);
    return;
  }
  if (ticket !== request) return;
  const langs = Array.isArray(deck.langs) ? deck.langs : [];
  rows.forEach((row, i) => { row.lang = langs[i] || ""; row.classList.toggle("hidden", !langs[i]); });
  slides = Array.isArray(deck.slides) ? deck.slides : [];
  if (!slides.length) return show("empty", `${movie.title} has no dialogue lines.`);
  show("slides");
  at = clamp(n - 1);
  render();
}

async function start() {
  try {
    movies = await getJson("movies.json");
  } catch (err) {
    const hint = location.protocol === "file:"
      ? "This browser blocks pages opened from disk; run python3 tools/serve.py and open the address it prints."
      : "Build a movie with tools/slides.py first.";
    return show("error", `Couldn't load the movie list (${err.message}). ${hint}`);
  }
  if (!Array.isArray(movies) || !movies.length) return show("empty", "No movies built yet. Run tools/slides.py.");
  for (const m of movies) picker.add(new Option(m.title, m.slug));
  picker.classList.remove("hidden");
  const h = fromHash();
  open(h.name, h.n);
}

picker.addEventListener("change", () => { picker.blur(); open(picker.value, 1); });
$("prev").addEventListener("click", () => go(at - 1));
$("next").addEventListener("click", () => go(at + 1));
$("tapprev").addEventListener("click", () => go(at - 1));
$("tapnext").addEventListener("click", () => go(at + 1));
window.addEventListener("hashchange", () => {
  if (!movies.length) return;
  const h = fromHash();
  if (h.name !== slug) open(h.name, h.n); else go(h.n - 1);
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target === picker) return;
  const step = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, " ": 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
  if (step) { e.preventDefault(); go(at + step); }
  else if (e.key === "Home") { e.preventDefault(); go(0); }
  else if (e.key === "End") { e.preventDefault(); go(slides.length - 1); }
});

// horizontal swipe; vertical drags are ignored so the page never fights a scroll
let x0 = null, y0 = null;
$("figure").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$("figure").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); go(at + (dx < 0 ? 1 : -1)); }
});

start();
</script>
</body>
</html>
